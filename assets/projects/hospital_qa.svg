      <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8C8375">Functional test execution, boundary value analysis &amp; requirement traceability</text>

      <!-- Table Header -->
      <g transform="translate(0, 80)">
        <rect width="980" height="36" fill="#1D1B1A" stroke="#2E2A28" rx="2"/>
