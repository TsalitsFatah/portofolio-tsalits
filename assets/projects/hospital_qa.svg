          <text x="120" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#F5F2EB">Pendaftaran Rawat Inap</text>
          <text x="320" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8C8375">Validasi input data pasien baru &amp; cek ketersediaan kamar</text>
          <text x="680" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#C8B89E">Equivalence Partition</text>
          <rect x="860" y="14" width="70" height="20" rx="2" fill="#6B1D2F" fill-opacity="0.3" stroke="#6B1D2F" stroke-width="0.8"/>
          <text x="895" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#EAE3D5">PASSED</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 104)">
