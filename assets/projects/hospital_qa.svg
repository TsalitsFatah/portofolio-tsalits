<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_qa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191817"/>
      <stop offset="100%" stop-color="#11100F"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bg_qa)"/>
  <circle cx="250" cy="220" r="280" fill="#6B1D2F" opacity="0.16" filter="blur(60px)"/>
  <circle cx="950" cy="580" r="300" fill="#5E1927" opacity="0.12" filter="blur(60px)"/>

  <!-- Border Editorial Frame -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#332E2C" stroke-width="1"/>
  <rect x="36" y="36" width="1128" height="728" fill="none" stroke="#6B1D2F" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Header -->
  <text x="70" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="4" fill="#A89F91">SOFTWARE QUALITY ASSURANCE // HOSPITAL INFORMATION SYSTEM</text>
  <text x="1130" y="80" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="3" fill="#6B1D2F">PDHUPL SPECIFICATION · TELKOM UNIVERSITY</text>
  <line x1="70" y1="100" x2="1130" y2="100" stroke="#2B2826" stroke-width="1"/>

  <!-- Main Container -->
  <g transform="translate(70, 140)">
