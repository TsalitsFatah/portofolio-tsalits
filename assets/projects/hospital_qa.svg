          <text x="20" y="28" font-family="'Courier New', monospace" font-size="11" fill="#A89F91">TC-HIS-002</text>
          <text x="120" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#F5F2EB">Rekam Medis Elektronik</text>
          <text x="320" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8C8375">Penyimpanan diagnosa dokter &amp; riwayat resep obat</text>
          <text x="680" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#C8B89E">Boundary Value</text>
          <rect x="860" y="14" width="70" height="20" rx="2" fill="#6B1D2F" fill-opacity="0.3" stroke="#6B1D2F" stroke-width="0.8"/>
          <text x="895" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#EAE3D5">PASSED</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(0, 160)">
          <rect width="980" height="48" fill="#161514" stroke="#252220" rx="2"/>
          <text x="20" y="28" font-family="'Courier New', monospace" font-size="11" fill="#A89F91">TC-HIS-003</text>
          <text x="120" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#F5F2EB">Manajemen Farmasi</text>
          <text x="320" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8C8375">Sinkronisasi stok obat realtime saat resep ditebus</text>
          <text x="680" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#C8B89E">Functional Testing</text>
          <rect x="860" y="14" width="70" height="20" rx="2" fill="#6B1D2F" fill-opacity="0.3" stroke="#6B1D2F" stroke-width="0.8"/>
          <text x="895" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#EAE3D5">PASSED</text>
        </g>

        <!-- Row 4 -->
        <g transform="translate(0, 216)">
          <rect width="980" height="48" fill="#161514" stroke="#252220" rx="2"/>
          <text x="20" y="28" font-family="'Courier New', monospace" font-size="11" fill="#A89F91">TC-HIS-004</text>
          <text x="120" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#F5F2EB">Billing &amp; Kasir Pembayaran</text>
          <text x="320" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8C8375">Kalkulasi tagihan rawat inap, tindakan, dan cetak invoice</text>
          <text x="680" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#C8B89E">Black Box Verification</text>
          <rect x="860" y="14" width="70" height="20" rx="2" fill="#6B1D2F" fill-opacity="0.3" stroke="#6B1D2F" stroke-width="0.8"/>
          <text x="895" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#EAE3D5">PASSED</text>
        </g>
