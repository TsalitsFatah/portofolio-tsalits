        <text x="120" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#C8B89E">MODUL SISTEM</text>
        <text x="320" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#C8B89E">SKENARIO PENGUJIAN</text>
        <text x="680" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#C8B89E">METODE UJI</text>
        <text x="860" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#C8B89E">STATUS</text>

