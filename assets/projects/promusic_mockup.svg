        <line x1="0" y1="32" x2="190" y2="32" stroke="#332D2A"/>
        <text x="12" y="52" font-family="'Courier New', monospace" font-size="10" fill="#A89F91">- isrcCode: String</text>
        <text x="12" y="70" font-family="'Courier New', monospace" font-size="10" fill="#A89F91">- audioStemUri: URI</text>
        <text x="12" y="88" font-family="'Courier New', monospace" font-size="10" fill="#A89F91">- sampleRate: Int</text>
        <line x1="0" y1="100" x2="190" y2="100" stroke="#2B2826"/>
        <text x="12" y="120" font-family="'Courier New', monospace" font-size="10" fill="#6B1D2F">+ splitRoyalties()</text>
        <text x="12" y="138" font-family="'Courier New', monospace" font-size="10" fill="#6B1D2F">+ generateStem()</text>

        <!-- Connector line -->
        <line x1="190" y1="80" x2="220" y2="80" stroke="#6B1D2F" stroke-width="1.5"/>

