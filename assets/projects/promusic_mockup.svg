    <!-- Waveform & Sound Track UI -->
    <g transform="translate(40, 70)">
      <text x="0" y="22" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="28" fill="#F5F2EB">Decentralized Audio Asset &amp; Split Royalties</text>
      <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8C8375">Orchestrating composers, lyricists, publishers, and streaming syndicates</text>

      <!-- Visual Audio Waveform -->
      <g transform="translate(0, 80)">
        <rect width="620" height="100" fill="#181716" stroke="#2B2826" rx="3"/>
        <!-- Fake Waveform Bars -->
        <g fill="#6B1D2F" opacity="0.85">
          <rect x="20" y="40" width="4" height="20" rx="2"/><rect x="30" y="30" width="4" height="40" rx="2"/>
          <rect x="40" y="20" width="4" height="60" rx="2"/><rect x="50" y="35" width="4" height="30" rx="2"/>
          <rect x="60" y="15" width="4" height="70" rx="2"/><rect x="70" y="25" width="4" height="50" rx="2"/>
          <rect x="80" y="10" width="4" height="80" rx="2"/><rect x="90" y="20" width="4" height="60" rx="2"/>
          <rect x="100" y="30" width="4" height="40" rx="2"/><rect x="110" y="42" width="4" height="16" rx="2"/>
          <rect x="120" y="25" width="4" height="50" rx="2"/><rect x="130" y="12" width="4" height="76" rx="2"/>
          <rect x="140" y="30" width="4" height="40" rx="2"/><rect x="150" y="18" width="4" height="64" rx="2"/>
          <rect x="160" y="24" width="4" height="52" rx="2"/><rect x="170" y="10" width="4" height="80" rx="2"/>
          <rect x="180" y="30" width="4" height="40" rx="2"/><rect x="190" y="38" width="4" height="24" rx="2"/>
          <rect x="200" y="14" width="4" height="72" rx="2"/><rect x="210" y="28" width="4" height="44" rx="2"/>
          <rect x="220" y="35" width="4" height="30" rx="2"/><rect x="230" y="10" width="4" height="80" rx="2"/>
          <rect x="240" y="22" width="4" height="56" rx="2"/><rect x="250" y="32" width="4" height="36" rx="2"/>
          <rect x="260" y="44" width="4" height="12" rx="2"/><rect x="270" y="20" width="4" height="60" rx="2"/>
          <rect x="280" y="15" width="4" height="70" rx="2"/><rect x="290" y="30" width="4" height="40" rx="2"/>
          <rect x="300" y="10" width="4" height="80" rx="2"/><rect x="310" y="25" width="4" height="50" rx="2"/>
          <rect x="320" y="18" width="4" height="64" rx="2"/><rect x="330" y="34" width="4" height="32" rx="2"/>
          <rect x="340" y="12" width="4" height="76" rx="2"/><rect x="350" y="28" width="4" height="44" rx="2"/>
          <rect x="360" y="40" width="4" height="20" rx="2"/><rect x="370" y="16" width="4" height="68" rx="2"/>
          <rect x="380" y="22" width="4" height="56" rx="2"/><rect x="390" y="10" width="4" height="80" rx="2"/>
          <rect x="400" y="30" width="4" height="40" rx="2"/><rect x="410" y="18" width="4" height="64" rx="2"/>
          <rect x="420" y="26" width="4" height="48" rx="2"/><rect x="430" y="35" width="4" height="30" rx="2"/>
          <rect x="440" y="14" width="4" height="72" rx="2"/><rect x="450" y="22" width="4" height="56" rx="2"/>
          <rect x="460" y="36" width="4" height="28" rx="2"/><rect x="470" y="10" width="4" height="80" rx="2"/>
          <rect x="480" y="25" width="4" height="50" rx="2"/><rect x="490" y="38" width="4" height="24" rx="2"/>
          <rect x="500" y="18" width="4" height="64" rx="2"/><rect x="510" y="28" width="4" height="44" rx="2"/>
          <rect x="520" y="12" width="4" height="76" rx="2"/><rect x="530" y="22" width="4" height="56" rx="2"/>
          <rect x="540" y="30" width="4" height="40" rx="2"/><rect x="550" y="40" width="4" height="20" rx="2"/>
