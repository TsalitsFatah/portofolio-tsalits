        <!-- Class 3 -->
        <rect x="440" y="0" width="180" height="160" fill="#181716" stroke="#332D2A" rx="2"/>
        <rect x="440" y="0" width="180" height="32" fill="#201E1D"/>
        <text x="452" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#F5F2EB">«Actor» Stakeholder</text>
        <line x1="440" y1="32" x2="620" y2="32" stroke="#332D2A"/>
        <text x="452" y="52" font-family="'Courier New', monospace" font-size="10" fill="#A89F91">- role: Musician | Pub</text>
        <text x="452" y="70" font-family="'Courier New', monospace" font-size="10" fill="#A89F91">- payoutMethod: IBAN</text>
        <text x="452" y="88" font-family="'Courier New', monospace" font-size="10" fill="#A89F91">- kycVerified: Bool</text>
        <line x1="440" y1="100" x2="620" y2="100" stroke="#2B2826"/>
        <text x="452" y="120" font-family="'Courier New', monospace" font-size="10" fill="#6B1D2F">+ claimRevenue()</text>
        <text x="452" y="138" font-family="'Courier New', monospace" font-size="10" fill="#6B1D2F">+ signContract()</text>
