        <text x="232" y="52" font-family="'Courier New', monospace" font-size="10" fill="#A89F91">- contractId: UUID</text>
        <text x="232" y="70" font-family="'Courier New', monospace" font-size="10" fill="#A89F91">- revenuePool: Float</text>
        <text x="232" y="88" font-family="'Courier New', monospace" font-size="10" fill="#A89F91">- contributorMap: Map</text>
        <line x1="220" y1="100" x2="410" y2="100" stroke="#2B2826"/>
        <text x="232" y="120" font-family="'Courier New', monospace" font-size="10" fill="#6B1D2F">+ disburseShares()</text>
        <text x="232" y="138" font-family="'Courier New', monospace" font-size="10" fill="#6B1D2F">+ auditTransactions()</text>

        <!-- Connector line -->
