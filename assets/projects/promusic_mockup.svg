<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191817"/>
      <stop offset="100%" stop-color="#121110"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bg2)"/>
  
  <!-- Subtle Burgundy Ambient Light -->
  <circle cx="200" cy="200" r="260" fill="#6B1D2F" opacity="0.16" filter="blur(60px)"/>
  <circle cx="1000" cy="650" r="280" fill="#5E1927" opacity="0.14" filter="blur(60px)"/>

  <!-- Editorial Frame -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#332E2C" stroke-width="1"/>
  <rect x="36" y="36" width="1128" height="728" fill="none" stroke="#6B1D2F" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Header -->
  <text x="70" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="4" fill="#A89F91">ENTERPRISE SYSTEM ARCHITECTURE // AUDIO COLLABORATION</text>
  <text x="1130" y="80" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="3" fill="#6B1D2F">N° 04 · PROMUSIC ECOSYSTEM</text>
  <line x1="70" y1="100" x2="1130" y2="100" stroke="#2B2826" stroke-width="1"/>

  <!-- Left: Audio Ecosystem & UML Workspace -->
  <g transform="translate(70, 140)">
