  <!-- Right: Architecture Monograph -->
  <g transform="translate(800, 140)">
    <rect width="330" height="580" rx="4" fill="#141312" stroke="#332D2A" stroke-width="1"/>
    <rect width="330" height="44" rx="4" fill="#1A1817"/>
    <text x="24" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#8C8375" letter-spacing="2">SPECIFICATION DOSSIER</text>

    <g transform="translate(24, 60)">
      <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2" fill="#6B1D2F">SOFTWARE REQUIREMENTS SPEC</text>
      <text x="0" y="48" font-family="'Cormorant Garamond', serif" font-size="22" fill="#F5F2EB">Promusic Architecture</text>
      <text x="0" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#8C8375" line-height="1.5">Meticulously constructed system models defining multi-tenant rights, high-bitrate streaming pipes, and automated escrow distribution.</text>

      <line x1="0" y1="110" x2="280" y2="110" stroke="#2B2826" stroke-width="1"/>

      <!-- Specs list -->
      <g transform="translate(0, 130)">
        <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="1" fill="#8C8375">01 · USE CASE BLUEPRINT</text>
        <text x="0" y="38" font-family="'Cormorant Garamond', serif" font-size="16" fill="#EAE3D5">18 Primary User Scenarios</text>

        <text x="0" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="1" fill="#8C8375">02 · SEQUENCE WORKFLOWS</text>
        <text x="0" y="98" font-family="'Cormorant Garamond', serif" font-size="16" fill="#EAE3D5">End-to-End Rights Validation</text>

        <text x="0" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="1" fill="#8C8375">03 · DATABASE NORMALIZATION</text>
        <text x="0" y="158" font-family="'Cormorant Garamond', serif" font-size="16" fill="#EAE3D5">Third Normal Form (3NF) Compliance</text>

        <text x="0" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="1" fill="#8C8375">04 · QUALITY ASSURANCE MATRIX</text>
        <text x="0" y="218" font-family="'Cormorant Garamond', serif" font-size="16" fill="#6B1D2F">100% Boundary Verification</text>
      </g>
    </g>
