<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Monographs — Tsalits Sabila Fatah</title>

  <meta name="description"
    content="Curated project monographs in software engineering, UI/UX systems, and biomedical AI research by Tsalits Sabila Fatah.">
  <meta name="theme-color" content="#050505">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#050505',
            surface: '#0D0F14',
            'surface-2': '#141A26',
            navy: {
              DEFAULT: '#1E3A8A',
              deep: '#172554'
            },
            'blue-accent': '#60A5FA',
            primary: { DEFAULT: '#1E3A8A', dark: '#172554', light: '#60A5FA' },
            accent: { DEFAULT: '#60A5FA', hover: '#93C5FD' },
            ivory: { DEFAULT: '#050505', light: '#0D0F14', warm: '#141A26' },
            charcoal: { DEFAULT: '#FFFFFF', soft: '#A1A8B8', muted: '#64748B' },
            burgundy: { DEFAULT: '#60A5FA', dark: '#172554', light: '#93C5FD' },
            beige: { DEFAULT: '#141A26', dark: '#1E293B' }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', '"Playfair Display"', 'Georgia', 'serif'],
            display: ['"Playfair Display"', '"Cormorant Garamond"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-[#050505] text-[#FFFFFF] selection:bg-[#1E3A8A] selection:text-white">

  <div class="grain-overlay" aria-hidden="true"></div>
  <div class="custom-cursor-dot" aria-hidden="true"></div>
  <div class="custom-cursor-ring" aria-hidden="true"></div>

  <header class="site-header py-5 md:py-7 px-6 lg:px-12">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="font-serif tracking-widest text-sm font-semibold text-white hover:text-[#60A5FA] transition-colors shrink-0">
        TSALITS
      </a>

      <nav class="hidden lg:flex items-center gap-10 font-sans mx-auto" aria-label="Main Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="experience.html" class="nav-link">Experience</a>
        <a href="projects.html" class="nav-link active">Project</a>
        <a href="organization.html" class="nav-link">Organization</a>
        <a href="index.html#skills" class="nav-link">Skills</a>
        <a href="index.html#contact" class="nav-link">Contact</a>
      </nav>

      <div class="w-16 hidden lg:block"></div>
    </div>
  </header>

  <main class="pt-28 md:pt-36 pb-24">
    <div class="max-w-7xl mx-auto px-6 lg:px-12">

      <div class="mb-8">
        <a href="index.html"
          class="text-xs uppercase tracking-widest text-[#60A5FA] font-sans font-semibold inline-flex items-center gap-2 hover:-translate-x-1 transition-transform">
          ← Return to Overview
        </a>
      </div>

      <div class="border-b border-[rgba(255,255,255,0.08)] pb-8 mb-16">
        <h1 class="editorial-title text-5xl sm:text-7xl md:text-8xl text-white leading-[0.92]">
          Selected <span class="editorial-italic font-serif text-[#60A5FA]">Projects</span>
        </h1>
      </div>

    </div>

    <!-- Container for dynamic full project monographs -->
    <div id="projects-container">
      <!-- Injected by app.js with full alternating layout and modal triggers -->
    </div>

    <div class="max-w-7xl mx-auto px-6 lg:px-12 pt-16">
      <div class="flex items-center justify-between pt-8 border-t border-[rgba(255,255,255,0.08)]">
        <a href="organization.html" class="btn-editorial btn-editorial-burgundy">
          <span>Lanjut ke Halaman Organization →</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Project Modal -->
  <div id="project-modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true"
    aria-label="Project Monograph Details">
    <div class="modal-content-container">
      <button id="project-modal-close" class="modal-close-btn" aria-label="Close Monograph Modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div id="project-modal-body"></div>
    </div>
  </div>

  <footer class="py-8 px-6 lg:px-12 bg-[#050505] text-[#A1A8B8] border-t border-[rgba(255,255,255,0.08)] font-sans text-xs">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="text-[11px] text-[#A1A8B8]">&copy; 2026. All rights reserved.</div>
      <a href="#" aria-label="Ascend to top"
        class="w-10 h-10 rounded-full bg-[#1E3A8A] hover:bg-[#3B82F6] text-white flex items-center justify-center shadow-lg transition-all duration-300 hover:scale-110 border border-slate-600/40">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </a>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>

</html>
