# Netlify Configuration for Tsalits Sabila Fatah Portfolio

[build]
  # Static deployment directly from root
  publish = "."

# Custom HTTP Headers for Security and Performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Dokumentasi/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

